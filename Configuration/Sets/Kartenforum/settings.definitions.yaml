    label: 'JSON string (object) containing the terrain configuration'
    category: kartenforum
    type: string
    default: '{"url":"https://terrain.kartenforum.slub-dresden.de/v2/{z}/{x}/{y}.png"}'
  plugin.tx_slubwebkartenforum.settings.georefApi:
    label: 'API endpoint of the georeference service'
    category: kartenforum
    type: string
    default: 'https://geo.test.kartenforum.slub-dresden.de'
